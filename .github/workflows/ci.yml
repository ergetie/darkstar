name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-backend:
    name: Lint Backend (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff
        run: uv run ruff check backend/ planner/ ml/ executor/ --output-format=github

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        run: uv run python -m pytest

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pyright
        run: uv run pyright

  validate-openapi:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt

      - name: Export and validate OpenAPI schema
        run: |
          python -c "
          import json
          import sys
          sys.path.insert(0, '.')

          # Import creates the app
          from backend.main import create_app
          app = create_app()

          # Get FastAPI from Socket.IO wrapper
          fastapi_app = app.other_asgi_app

          # Export OpenAPI
          schema = fastapi_app.openapi()

          # Basic validation
          assert 'openapi' in schema, 'Missing openapi version'
          assert 'info' in schema, 'Missing info section'
          assert 'paths' in schema, 'Missing paths section'
          assert len(schema['paths']) > 50, f'Expected 50+ routes, got {len(schema[\"paths\"])}'

          print(f'✓ OpenAPI schema valid: {len(schema[\"paths\"])} paths defined')
          print(json.dumps(schema['info'], indent=2))
          "
