# ============================================================
# Inverter Profile: Fronius
# Schema Version: 2
# ============================================================

metadata:
  name: "fronius"
  version: "2.0.0"
  schema_version: 2
  description: "Fronius GEN24 hybrid inverters using Watts-based control"
  supported_brands:
    - "Fronius"

  detect:
    integrations: ['fronius', 'modbus']
    manufacturers: ['Fronius', 'BYD']

entities:
  work_mode:
    match:
      domain: [select]
      integration: ['fronius', 'modbus']
      entity_id_regex: "storage[ _]control[ _]mode|work[ _]mode"
      name_regex: "storage[ _]control[ _]mode|work[ _]mode"
    default_entity: null
    domain: "select"
    category: "system"
    description: "Storage control mode selector"
    required: true

  # NOTE: minimum_reserve is the safety reserve (bottom SoC threshold).
  # It should be configured manually in HAand NEVER written by Darkstar.
  # Modifying this could cause dangerous battery behavior.
  minimum_reserve:
    match:
      domain: [number]
      integration: ['fronius', 'modbus']
      entity_id_regex: "minimum[ _]reserve"
      name_regex: "minimum[ _]reserve"
      unit: ["%"]
    default_entity: null
    domain: "number"
    category: "system"
    description: "Minimum battery reserve percentage (safety floor) - NEVER WRITE THIS"
    required: false

  grid_charge_power:
    match:
      domain: [number]
      integration: ['fronius', 'modbus']
      entity_id_regex: "grid[ _]charge[ _]power"
      name_regex: "grid[ _]charge[ _]power"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Grid charging power (Watts) - used in Charge from Grid mode"
    required: true

  grid_discharge_power:
    match:
      domain: [number]
      integration: ['fronius', 'modbus']
      entity_id_regex: "grid[ _]discharge[ _]power"
      name_regex: "grid[ _]discharge[ _]power"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Grid discharge power (Watts) - used in Discharge to Grid mode"
    required: true

  export_power_limit_enable:
    match:
      domain: [select]
      integration: ['fronius', 'modbus']
      entity_id_regex: "export[ _]limit[ _]enable"
      name_regex: "export[ _]limit[ _]enable"
    default_entity: null
    domain: "select"
    category: "battery"
    description: "Export limit enable select"
    required: false

  export_power_limit:
    match:
      domain: [number]
      integration: ['fronius', 'modbus']
      entity_id_regex: "export[ _]limit[ _](rate|power)|export[ _]power[ _]limit"
      name_regex: "export[ _]limit[ _](rate|power)|export[ _]power[ _]limit"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Max solar export power (Watts)"
    required: false

modes:
  charge:
    description: "Grid charge - Force charge from AC grid"
    actions:
      - entity: "work_mode"
        value: "Charge from Grid"
        settle_ms: 500
      - entity: "grid_charge_power"
        value: "{{charge_value}}"

  export:
    description: "Grid export - Maximize battery discharge to grid"
    actions:
      - entity: "work_mode"
        value: "Discharge to Grid"
        settle_ms: 500
      - entity: "grid_discharge_power"
        value: "{{export_with_load_w}}"

  self_consumption:
    description: "Self consumption - Normal automatic operation"
    actions:
      - entity: "work_mode"
        value: "Auto"
        settle_ms: 500

  idle:
    description: "Idle / Hold - Block battery discharge"
    actions:
      - entity: "work_mode"
        value: "Block Discharging"
        settle_ms: 500

behavior:
  control_unit: "W"
  min_charge_w: 100.0
  round_step_w: 100.0
  grid_charge_round_step_w: 100.0
  write_threshold_w: 100.0
  mode_settling_ms: 500

# ============================================================
# IMPORTANT NOTES (from callifo/fronius_modbus integration)
# ============================================================
#
# 1. GRID CHARGING EFFICIENCY:
#    Grid charging efficiency is approximately 50-60% at low power
#    levels (< 1000W). It improves at higher power levels.
#
# 2. POWER ROUNDING:
#    Grid Charge Power must be set in multiples of 10W. If not
#    rounded to 10, it may cause odd behavior (e.g., charging at
#    500W instead of requested value).
#
# 3. POWER RESET:
#    After changing modes, power values are automatically reset to 0.
#    You must set the power value AFTER selecting the mode.
#
# 4. FIRMWARE:
#    Update GEN24 inverter firmware to 1.34.6-1 or higher.
#    Otherwise battery charging might be limited.
#
# 5. SCHEDULED CHARGING:
#    Turn off scheduled (dis)charging in the Fronius Web UI to
#    avoid unexpected behavior.
#
# 6. MODE ORDERING:
#    Always change the mode FIRST, then set controls active
#    in that mode. This profile uses settle_ms to ensure proper
#    sequencing.
#
# 7. MODE BEHAVIOR (from integration docs):
#    - Auto: Allows charging/discharging up to minimum reserve
#    - Charge from Grid: Uses 'Grid Charge Power' entity
#    - Discharge to Grid: Uses 'Grid Discharge Power' entity
#    - Block discharging: Only PV charging allowed
#    - Block charging: Only discharging allowed
#
# 8. EXPORT LIMIT:
#    Export limit works independently of storage mode.
#    Enable switch first, then set limit value.
#
# 9. CONTROL MODES (from integration docs):
#    - Auto
#    - PV Charge Limit
#    - Discharge Limit
#    - PV Charge and Discharge Limit
#    - Charge from Grid
#    - Discharge to Grid
#    - Block Discharging
#    - Block Charging
#
# 10. EXPORT POWER LIMIT ENTITIES (export_power_limit, export_power_limit_enable):
#     These entities limit PV SURPLUS export to grid, NOT battery discharge.
#     They were removed from "export" mode because they were incorrectly
#     capping battery discharge exports.
#
#     NOTE: These entities are kept defined for potential future use cases,
#     such as stopping PV export during negative electricity prices (e.g.,
#     setting export limit to 0W during negative price hours).
#     When used, they would be set in "self_consumption" mode to limit
#     PV feed-in, not in "export" mode for battery discharge.
