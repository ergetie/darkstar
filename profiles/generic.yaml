# ============================================================
# Inverter Profile: Generic
# Schema Version: 2
# ============================================================

metadata:
  name: "generic"
  version: "2.0.0"
  schema_version: 2
  description: "Generic inverter profile — configure entities manually"
  supported_brands:
    - "Generic"
    - "Other"

entities:
  work_mode:
    match:
      domain: [select]
      entity_id_regex: "work[ _]mode"
      name_regex: "work[ _]mode"
    default_entity: null
    domain: "select"
    category: "system"
    description: "Inverter work mode selector"
    required: true

  grid_charging_enable:
    match:
      domain: [switch]
      entity_id_regex: "grid[ _]charging[ _]enable"
      name_regex: "grid[ _]charging[ _]enable"
    default_entity: null
    domain: "switch"
    category: "system"
    description: "Grid charging on/off switch"
    required: true

  soc_target:
    match:
      domain: [number]
      entity_id_regex: "soc[ _]target"
      name_regex: "soc[ _]target"
      unit: ["%"]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Battery SoC target percentage"
    required: false

  max_charge_current:
    match:
      domain: [number]
      entity_id_regex: "max[ _]charge[ _]current"
      name_regex: "max[ _]charge[ _]current"
      unit: [A]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Maximum battery charging current (Amps)"
    required: true

  max_discharge_current:
    match:
      domain: [number]
      entity_id_regex: "max[ _]discharge[ _]current"
      name_regex: "max[ _]discharge[ _]current"
      unit: [A]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Maximum battery discharge current (Amps)"
    required: true

  max_charge_power:
    match:
      domain: [number]
      entity_id_regex: "max[ _]charge[ _]power"
      name_regex: "max[ _]charge[ _]power"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Maximum battery charging power (Watts)"
    required: false

  max_discharge_power:
    match:
      domain: [number]
      entity_id_regex: "max[ _]discharge[ _]power"
      name_regex: "max[ _]discharge[ _]power"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Maximum battery discharge power (Watts)"
    required: false

  export_power_limit:
    match:
      domain: [number]
      entity_id_regex: "export[ _]power[ _]limit"
      name_regex: "export[ _]power[ _]limit"
      unit: [W, kW]
    default_entity: null
    domain: "number"
    category: "battery"
    description: "Grid export power limit (Watts) - configure entity ID in UI"
    required: false

modes:
  charge:
    description: "Grid charge — charge battery from AC grid"
    actions:
      - entity: "work_mode"
        value: "CONFIGURE_ME"
      - entity: "grid_charging_enable"
        value: true
      - entity: "max_charge_current"
        value: "{{charge_value}}"
      - entity: "soc_target"
        value: "{{soc_target}}"

  export:
    description: "Grid export — discharge battery to grid"
    actions:
      - entity: "work_mode"
        value: "CONFIGURE_ME"
      - entity: "grid_charging_enable"
        value: false
      - entity: "max_discharge_current"
        value: "{{discharge_value}}"
      - entity: "export_power_limit"
        value: "{{export_power_w}}"

  self_consumption:
    description: "Self consumption — normal operation"
    actions:
      - entity: "work_mode"
        value: "CONFIGURE_ME"
      - entity: "grid_charging_enable"
        value: false
      - entity: "soc_target"
        value: "{{soc_target}}"

  idle:
    description: "Idle / Hold — block discharge, preserve battery"
    actions:
      - entity: "work_mode"
        value: "CONFIGURE_ME"
      - entity: "grid_charging_enable"
        value: false
      - entity: "max_discharge_current"
        value: 0
      - entity: "soc_target"
        value: "{{soc_target}}"

behavior:
  control_unit: "A"
  min_charge_a: 1.0
  round_step_a: 1.0
  write_threshold_a: 5.0
  mode_settling_ms: 100
