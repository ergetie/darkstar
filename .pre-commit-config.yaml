repos:
  # Ruff runs from the project's pinned install (requirements-dev.txt) via
  # `uv run`, NOT a separately-versioned pre-commit mirror. This guarantees the
  # ruff used on commit is byte-identical to the ruff CI runs — no version skew.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        entry: env UV_NO_SYNC=1 uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: env UV_NO_SYNC=1 uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: env UV_NO_SYNC=1 uv run pyright
        language: system
        types: [python]
        pass_filenames: true
        exclude: ^tests/
      - id: validate-profiles
        name: Validate Inverter Profiles
        entry: env UV_NO_SYNC=1 uv run python scripts/validate_profiles.py
        language: system
        files: ^profiles/.*\.yaml$
        exclude: ^profiles/schema\.yaml$
        pass_filenames: true
      - id: eslint-frontend
        name: ESLint + Prettier (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix --max-warnings 0 --no-warn-ignored "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.[jt]sx?$
        exclude: ^frontend/node_modules/
      # Full CI gate, runs on `git push` (not every commit). Mirrors the GitHub
      # Actions CI exactly so a green push locally means a green push in CI.
      - id: ci-gate
        name: CI gate (ruff + pyright + tests + openapi)
        entry: scripts/ci_local.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
